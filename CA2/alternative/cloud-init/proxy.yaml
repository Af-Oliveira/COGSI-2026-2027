#cloud-config
# =============================================================================
# cloud-init/proxy.yaml - COGSI CA2 / Alternative (Multipass + cloud-init)
# -----------------------------------------------------------------------------
# Declares the proxy instance: Nginx listens on port 80 and forwards every
# request to the Bookstore on the app instance. It is the only instance whose
# application port is open to the host.
#
# Placeholders replaced by up.sh before the file is given to Multipass:
#   @@PUBLIC_KEY@@   public half of the SSH key generated for this instance
#   @@APP_PORT@@     HTTP port of the Bookstore
#   @@MAC@@, @@IP@@  MAC and static address of the private interface
#   @@DB_IP@@, @@APP_IP@@, @@PROXY_IP@@   addresses written to /etc/hosts
# =============================================================================

# Multipass enables this option, which makes cloud-init rewrite /etc/hosts on
# every boot and would drop the names added below.
manage_etc_hosts: false

# Custom SSH key of this instance, added to the default user (ubuntu).
ssh_authorized_keys:
  - @@PUBLIC_KEY@@

package_update: true
packages:
  - nginx
  - netcat-openbsd
  - curl
  - ufw

write_files:
  # Static address on the interface bridged by Multipass (--network), matched
  # by the MAC address that up.sh assigns to it. This is the private network
  # of the three instances.
  - path: /etc/netplan/60-cogsi-private.yaml
    content: |
      network:
        version: 2
        ethernets:
          cogsi-private:
            match:
              macaddress: "@@MAC@@"
            addresses: [@@IP@@/24]

  - path: /etc/nginx/sites-available/bookstore
    content: |
      # Managed by cloud-init (CA2/alternative/cloud-init/proxy.yaml).
      upstream bookstore {
          server app:@@APP_PORT@@;
      }

      server {
          listen 80 default_server;
          server_name _;

          location / {
              proxy_pass http://bookstore;

              # Pass the address the client used, so that the links generated
              # by the application (HATEOAS) point back to the proxy.
              proxy_set_header Host              $http_host;
              proxy_set_header X-Real-IP         $remote_addr;
              proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              proxy_connect_timeout 5s;
              proxy_read_timeout    60s;
          }
      }

runcmd:
  # Permissions are set here and not with "permissions:" in write_files:
  # Multipass rewrites the YAML it receives and turns a quoted mode such as
  # "0600" into a number, which cloud-init reports as a schema error.
  - chmod 0600 /etc/netplan/60-cogsi-private.yaml
  # Private network up, and the names of the three instances.
  - netplan apply
  - printf '%s\n' '# BEGIN cogsi-ca2' '@@DB_IP@@ db' '@@APP_IP@@ app' '@@PROXY_IP@@ proxy' '# END cogsi-ca2' >> /etc/hosts
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw --force enable
  # Replace the default site with the Bookstore site and validate it.
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sfn /etc/nginx/sites-available/bookstore /etc/nginx/sites-enabled/bookstore
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx

final_message: "proxy instance ready after $UPTIME seconds"
