// This is the build configuration for the chat server application.
// It defines the plugins, dependencies, and tasks needed to build and run the application.

// Apply the application plugin to add support for building a Java application
plugins {
    id 'application'
}

 // Use Maven Central for resolving dependencies.
repositories {
    mavenCentral()
}

// Declare the dependencies for the application.
dependencies {
    implementation      libs.log4j.api
    implementation      libs.log4j.core

    // JUnit 5 is required to compile and run the unit tests in src/test/java.
    testImplementation  libs.junit.jupiter
    // Gradle 9 requires the JUnit Platform launcher to be present on the test runtime classpath.
    testRuntimeOnly     libs.junit.platform.launcher
}

// Configure the built-in test task to discover and run JUnit 5 (Jupiter) tests.
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Set the version of the application, using a property from gradle.properties or defaulting to 'unspecified'.
version = project.findProperty('appVersion') ?: 'unspecified'

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Configure the application plugin with the main class of the application.
application {
    mainClass = 'org.example.App'
}

// Generate a thin JAR that includes the application classes and resources, but not the dependencies (the default).
tasks.named('jar') {
    archiveBaseName = 'chat-server'
    archiveVersion = project.version.toString()

    doLast {
        println "Generated application JAR: ${archiveFile.get().asFile.name}"
    }
}

// Custom task to copy runtime dependencies into a separate directory for easier packaging
tasks.register('copyDependencies', Copy) {
    group = 'build'
    description = 'Copies runtime dependencies to the application lib directory'

    from(configurations.runtimeClasspath)
    into(layout.buildDirectory.dir('libs/lib'))
}

// Custom task to package the application JAR along with its dependencies into a single directory
tasks.register('packageApp') {
    group = 'build'
    description = 'Builds the JAR and copies runtime dependencies'

    dependsOn(tasks.named('jar'))
    dependsOn(tasks.named('copyDependencies'))
}

// Custom task to display basic project and build information.
tasks.register('printProjectInfo') {
    group = 'Help'
    description = 'Displays basic project and build information'

    // These values are evaluated during the configuration phase.
    def projectName = project.name
    def projectVersion = project.version
    def gradleVersion = gradle.gradleVersion

    doLast {
        println "=============================="
        println "Project Name: $projectName"
        println "Project Version: $projectVersion"
        println "Gradle Version: $gradleVersion"
        // These values are queried when the task executes.
        println "Java Toolchain Version: ${java.toolchain.languageVersion.get()}"
        println "Build Directory: ${layout.buildDirectory.get().asFile}"
        println "=============================="
    }
}


// Custom task to clean up log files generated during the build process.
tasks.register('cleanLogs', Delete) {
    group = 'Build'
    description = 'Deletes log files from the build directory'

    delete fileTree(dir: layout.buildDirectory, include: '**/*.log')
}

// Custom task to run the chat client application.
// The server IP and port can be configured through Gradle properties.
tasks.register('runClient', JavaExec) {
    group = 'DevOps'
    description = 'Launches the chat client and connects it to a chat server'

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.example.ChatClientApp')

    def serverIP = providers.gradleProperty('serverIP').orElse('localhost')
    def serverPort = providers.gradleProperty('serverPort').orElse('59001')

    args(serverIP.get(), serverPort.get())

    doFirst {
        println "Starting ChatClientApp with server IP: ${serverIP.get()} and port: ${serverPort.get()}"
    }
}

// Custom task to run the chat server application (the peer of runClient).
// The listening port can be configured through the 'serverPort' Gradle property.
tasks.register('runServer', JavaExec) {
    group = 'DevOps'
    description = 'Launches the chat server on a configurable port'

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.example.ChatServerApp')

    def serverPort = providers.gradleProperty('serverPort').orElse('59001')
    args(serverPort.get())

    doFirst {
        println "Starting ChatServerApp on port ${serverPort.get()}"
    }
}

// Custom task to back up the application source directories.
// It copies ONLY the source trees (src/main and src/test) into a backup folder.
tasks.register('backupSources', Copy) {
    group = 'build'
    description = 'Copies the application source directories into a backup folder'

    from('src') {
        include 'main/**'
        include 'test/**'
    }
    into(layout.buildDirectory.dir('backup/sources'))
}

// Custom task to archive the source backup into a zip file.
// It depends on backupSources, so the backup is always produced before archiving.
tasks.register('backupZip', Zip) {
    group = 'build'
    description = 'Archives the source backup produced by backupSources into a zip file'

    dependsOn(tasks.named('backupSources'))

    from(layout.buildDirectory.dir('backup/sources'))
    archiveBaseName = 'chat-server-sources'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('distributions')
}