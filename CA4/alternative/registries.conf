# Short-name aliases for the base images of CA4, used by Podman through
# CONTAINERS_REGISTRIES_CONF. Podman refuses unqualified names unless they are
# aliased or a search registry is configured; an alias pins each name to one
# registry, so "nginx" can never be resolved against another registry.
[aliases]
"eclipse-temurin" = "docker.io/library/eclipse-temurin"
"nginx" = "docker.io/library/nginx"
"registry" = "docker.io/library/registry"
