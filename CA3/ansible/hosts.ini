# Static inventory: one group per tier of CA2 Part 2. The group names are
# plural so that they never clash with the host names.
#
# Vagrant runs Ansible inside each guest (ansible_local) and limits the run to
# that guest, so every host is managed over a local connection. ansible_host
# records the private address of each machine for the other tiers.

[dbservers]
db ansible_host=192.168.56.22

[appservers]
app ansible_host=192.168.56.21

[proxyservers]
proxy ansible_host=192.168.56.20

[all:vars]
ansible_connection=local
