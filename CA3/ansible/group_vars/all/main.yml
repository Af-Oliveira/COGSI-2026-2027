---
# Values shared by every tier. The address of each machine comes from the
# inventory, so the topology is defined in a single place.
h2_port: 9092
app_port: 8080

# Credentials of the Bookstore database. The password is kept encrypted with
# Ansible Vault in vault.yml and only referenced here.
db_name: bookstore
db_user: bookstore
db_password: "{{ vault_db_password }}"

# Group whose members may read the application on app and the database files
# on db, and the developer account that belongs to it.
developers_group: developers
devuser_name: devuser
devuser_password: "{{ vault_devuser_password }}"
devuser_password_salt: "{{ vault_devuser_password_salt }}"
