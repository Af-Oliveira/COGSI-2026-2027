---
# Replaces the /etc/hosts block written by CA2 base.sh. blockinfile manages the
# lines between its markers, so the block is rewritten only when it changes.
- name: List every machine of the inventory in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} cogsi-ca3"
    block: |
      {% for host in groups['all'] | sort %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
