---
# Incoming traffic is denied by default; each tier opens only its own port.
# SSH stays open because Vagrant manages the machines through it.
- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable the firewall
  community.general.ufw:
    state: enabled
