---
- name: Create the h2 service account
  ansible.builtin.user:
    name: "{{ h2_user }}"
    system: true
    home: "{{ h2_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ h2_data_group }}"
    append: true

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ h2_data_dir }}"
    state: directory
    owner: "{{ h2_user }}"
    group: "{{ h2_data_group }}"
    # setgid: files created by H2 inherit the group of the directory.
    mode: "2770"

# Database files created before the directory belonged to the developers
# group (or copied in) are brought to the same ownership and mode.
- name: Find the existing database files
  ansible.builtin.find:
    paths: "{{ h2_data_dir }}"
  register: h2_data_files

- name: Give the database files to the {{ h2_data_group }} group
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ h2_user }}"
    group: "{{ h2_data_group }}"
    mode: "u=rw,g=rw,o="
  loop: "{{ h2_data_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install the systemd unit
  ansible.builtin.template:
    src: h2.service.j2
    dest: /etc/systemd/system/h2.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart h2

- name: Enable and start h2
  ansible.builtin.systemd_service:
    name: h2
    enabled: true
    state: started
    daemon_reload: true

# A changed unit or jar must be applied now, before the port is checked.
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for H2 to listen on port {{ h2_port }}
  ansible.builtin.wait_for:
    port: "{{ h2_port }}"
    host: 127.0.0.1
    timeout: 60
