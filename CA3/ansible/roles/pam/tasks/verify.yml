---
- name: Read the PAM stack after the changes
  ansible.builtin.slurp:
    src: "/etc/pam.d/{{ item }}"
  loop:
    - common-auth
    - common-account
    - common-password
  register: pam_final

# The modules must be present and in the right order: faillock preauth before
# pam_unix and authfail after it (auth), faillock before pam_unix (account,
# otherwise the jump of pam_unix skips it), and pwquality, pwhistory, pam_unix
# (password).
- name: Check the order of the modules
  ansible.builtin.assert:
    that:
      - pam_auth is search('(?s)pam_faillock\.so preauth.*pam_unix\.so.*pam_faillock\.so authfail')
      - pam_account is search('(?s)pam_faillock\.so.*pam_unix\.so')
      - pam_password is search('(?s)pam_pwquality\.so.*pam_pwhistory\.so.*pam_unix\.so')
    success_msg: >-
      auth: faillock preauth > pam_unix > faillock authfail;
      account: faillock > pam_unix;
      password: pwquality > pwhistory > pam_unix
  vars:
    pam_auth: "{{ pam_final.results[0].content | b64decode | regex_replace('(?m)^#.*$', '') }}"
    pam_account: "{{ pam_final.results[1].content | b64decode | regex_replace('(?m)^#.*$', '') }}"
    pam_password: "{{ pam_final.results[2].content | b64decode | regex_replace('(?m)^#.*$', '') }}"
