# Project configuration, read by every ansible command run from this folder.
[defaults]
inventory = hosts.ini
roles_path = roles
# The recap of each run is the evidence of idempotence; keep the output plain.
stdout_callback = default
retry_files_enabled = False
# Python 3 is part of the Ubuntu 24.04 box; no interpreter discovery warnings.
interpreter_python = /usr/bin/python3
